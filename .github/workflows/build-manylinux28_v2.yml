name: Build manylinux_2_34 wheel (cp313)

on:
  push:
    branches: [ build-manylinux28 ]
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: messense/maturin-action@v1
        with:
          manylinux: '2_34'
          target: x86_64
          # 容器内装 capnp + 可选限速省内存
          before-script-linux: |
            set -e
            echo ">>> Installing Cap’n Proto inside manylinux_2_34 container <<<"
            yum install -y git gcc-c++ make autoconf automake libtool openssl-devel
            cd /tmp
            git clone https://github.com/capnproto/capnproto.git --depth=1 --branch v1.0.2
            cd capnproto/c++
            autoreconf -fi
            ./configure --prefix=/usr/local --enable-shared
            make -j$(nproc)
            make install
            # 👇 关键：先退出编译的目录，再删除源码，彻底避免被扫描
            cd /tmp
            rm -rf /tmp/capnproto
            ldconfig
            capnp --version
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
            pkg-config --exists capnp && echo "✅ capnp available via pkg-config"

            #yum install -y epel-release
            #yum install -y capnproto capnp-devel
            # （可选）限 1 核 + 无 LTO 省内存
            # export CARGO_BUILD_JOBS=1
            # export RUSTFLAGS="-C lto=off"

          # *** 显式指定含 [package] 的 crate ***
          # 这个也是调试了好久通过KIMI找到的答案
          working-directory: ./crates/pyo3
          args: >
            --release --all-features
            --interpreter python3.13
            --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-trader-manylinux2_34-cp313
          path: dist/*.whl
