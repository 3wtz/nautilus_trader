name: Build manylinux_2_28 wheel (cp313)

on:
  push:
    branches: [ main, build-manylinux28 ]
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: messense/maturin-action@v1
        with:
          manylinux: '2_28'
          target: x86_64
          args: >
            --release --all-features
            --interpreter python3.13
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-trader-manylinux2_28-cp313
          path: dist/*.whl
