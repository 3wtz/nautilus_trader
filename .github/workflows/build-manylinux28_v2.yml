name: Build manylinux_2_34 wheel (cp313)

on:
  push:
    branches: [ build-manylinux28 ]
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: messense/maturin-action@v1
        with:
          manylinux: '2_34'
          target: x86_64
          # 容器内装 capnp + 可选限速省内存
          before-script-linux: |
            # 下载官方 capnp 0.10.x 二进制（x86_64 Linux）
            curl -L -o /tmp/capnp.tar.gz \
              https://github.com/capnproto/capnproto/releases/download/v0.10.2/capnproto-0.10.2-linux-x86_64.tar.gz
            tar -C /tmp -xzf /tmp/capnp.tar.gz
            cp /tmp/capnproto-0.10.2-linux-x86_64/bin/capnp /usr/local/bin/
            chmod +x /usr/local/bin/capnp
            # 验证版本
            capnp --version

            #yum install -y epel-release
            #yum install -y capnproto capnp-devel
            # （可选）限 1 核 + 无 LTO 省内存
            # export CARGO_BUILD_JOBS=1
            # export RUSTFLAGS="-C lto=off"
          # *** 显式指定含 [package] 的 crate ***
          working-directory: ./crates/pyo3
          args: >
            --release --all-features
            --interpreter python3.13
            --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-trader-manylinux2_34-cp313
          path: dist/*.whl
