name: Build nautilus_trader manylinux_2_34 wheel

on:
  push:
    branches: [ build-manylinux28 ]
  workflow_dispatch:

jobs:
  build:
    name: Build for manylinux_2_34_x86_64 (Python 3.13)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_34_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          yum install -y git clang make pkg-config capnproto-devel

      - name: Set up Python 3.13
        run: |
          # Use pre-installed Python 3.13
          ln -sf /opt/python/cp313-cp313/bin/python /usr/local/bin/python
          ln -sf /opt/python/cp313-cp313/bin/pip /usr/local/bin/pip
          python -m pip install --upgrade pip uv

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Python build dependencies
        run: |
          pip install "cython>=3.0.11" "numpy>=1.26" "setuptools" "packaging"

      - name: Build Rust and Cython extensions
        run: |
          BUILD_MODE=release \
          PARALLEL_BUILD=true \
          COPY_TO_SOURCE=true \
          python build.py

      - name: Build wheel with uv
        run: |
          uv build --wheel

      - name: Repair wheel with auditwheel (ensure manylinux compliance)
        run: |
          # The wheel is already manylinux_2_34 compatible, but repair ensures no external deps
          auditwheel repair dist/*.whl -w dist_repaired/
          mv dist_repaired/*.whl dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-trader-manylinux_2_34-py313
          path: dist/*.whl
