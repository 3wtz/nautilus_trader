name: Build manylinux_2_28 (cp313)

on:
  push:
    branches:
      - main
      - build-manylinux28
  workflow_dispatch:

jobs:
  manylinux:
    strategy:
      matrix:
        manylinux: [ '2_28' ]   # 未来可加 2_31/2_34
        python:    [ '3.13' ]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 官方 Rust 工具链（缓存 + 自动配置）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # 官方 maturin 动作（自带 manylinux_2_28 容器）
      - uses: messense/maturin-action@v1
        with:
          manylinux: ${{ matrix.manylinux }}
          target: x86_64
          working-directory: ./nautilus_pyo3
          args: >
            --release --all-features
            --interpreter python${{ matrix.python }}
            --out dist

      # 官方 auditwheel 修复 & 上传
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-trader-${{ matrix.manylinux }}-cp${{ matrix.python }}
          path: dist/*.whl
