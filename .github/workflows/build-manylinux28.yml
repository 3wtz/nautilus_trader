name: Build manylinux_2_28 wheel (cp313)

on:
  push:
    branches: [ main, build-manylinux28 ]
  workflow_dispatch:          # 手动触发按钮

jobs:
  wheel:
    runs-on: ubuntu-latest
    # 官方 manylinux_2_28 容器（glibc 2.28 ≤ RockyLinux 9）
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          yum install -y openssl-devel zlib-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-gnu

      - name: Build wheel (maturin)
        run: |
          source "$HOME/.cargo/env"
          /opt/python/cp313/bin/python -m pip install -U pip maturin[patchelf] uv
          maturin build --release --all-features --interpreter /opt/python/cp313/bin/python --out dist

      - name: Audit wheel (manylinux tag)
        run: |
          /opt/python/cp313/bin/python -m pip install auditwheel
          auditwheel show dist/*cp313*.whl
          # 确保标签 ≤ manylinux_2_28
          auditwheel repair --plat manylinux_2_28_x86_64 dist/*cp313*.whl -w manylinux dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nautilus_trader-manylinux2_28-cp313-whl
          path: manylinux dist/nautilus_trader-*manylinux*.whl
