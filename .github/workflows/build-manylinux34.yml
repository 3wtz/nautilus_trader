name: Build nautilus_trader for Rocky Linux 9

on:
  push:
    branches: [ build-manylinux28 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_34_x86_64
      options: --user root

    strategy:
      matrix:
        python-version: ["3.13"]

    env:
      CAPNP_PREFIX: "/usr/local"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          pip install --no-cache-dir \
            poetry \
            maturin>=1.5 \
            cython==3.1.4 \
            numpy>=1.26.4
          curl -O https://capnproto.org/capnproto-c++-1.0.tar.gz
          tar -xzf capnproto-c++-1.0.tar.gz
          cd capnproto-c++-1.0
          ./configure --prefix=$CAPNP_PREFIX
          make -j$(nproc)
          make install
          ldconfig

      - name: Build wheel
        run: |
          echo "✅ Verifying lib.name (must be nautilus_pyo3):"
          grep 'lib.name = "nautilus_pyo3"' crates/pyo3/Cargo.toml
          echo "📦 Building wheel (triggers build.py):"
          poetry build --wheel --outdir dist/

      - name: Verify wheel contents
        run: |
          echo "🔍 Expected: nautilus_trader/core/nautilus_pyo3.cpython-*.so"
          unzip -l dist/nautilus_trader-*.whl | grep -E "nautilus_pyo3\.cpython-"

      - uses: actions/upload-artifact@v4
        with:
          name: nautilus_trader-wheel
          path: dist/*.whl
